<script>
const MAJ_NAMES=['바보','마법사','여사제','여황제','황제','교황','연인','전차','힘','은둔자','운명의 수레바퀴','정의','매달린 사람','죽음','절제','악마','탑','별','달','태양','심판','세계'];
/* [별명, 그림기호, 전통 그림 장면, 핵심어, 정방향, 역방향, 해볼 일, 밝기(1 밝음·0 중간·-1 조심)] */
const MAJ=[
['첫걸음 여행자','🎒','절벽 끝에서 하늘을 보며 가볍게 걸어가는 젊은이와 작은 개','새로운 출발','새로운 일을 설레는 마음으로 시작하는 카드예요. 다 알지 못해도 호기심과 용기가 길을 열어 줘요.','들뜬 마음에 발밑을 못 보거나, 반대로 겁이 나서 첫걸음을 미루는 모습이에요.','완벽한 준비를 기다리지 말고, 오늘 할 수 있는 가장 작은 첫걸음 하나를 해 보세요. 단, 꼭 필요한 준비물은 확인해요.',1],

 if(ni>=0&&ai>=0){const nc=cs[ni],ac=cs[ai],bc2=bi2>=0?cs[bi2]:null;out.paras.push(`이야기를 이어 보면, 지금은 ‘${esc(nc.kw)}’의 모습인데${bc2?` ‘${esc(bc2.tone<0?bc2.kw:jo(bc2.kw,'이','가')+' 지나친 것')}’ 때문에 발걸음이 무거워지기 쉬워요`:''}. 그 매듭은 ‘${esc(ac.kw)}’로 풀어 갈 수 있어요. ${esc(sit.label)} 고민이라면, ${sit.ex[exKey(ac)]}`)}

 if(ad.arc==='major')return `🌳 사주에서 <b>${FR[f]} 친구</b>였던 ${who}에게 큰 그림 카드 ‘${esc(ad.name)}’가 찾아왔어요. 큰 그림 카드는 다섯 친구 모두에게 찾아오는 특별한 손님이라, 이번 고민이 꽤 중요하다는 뜻으로 읽어요.`;
 const k=ad.sk==='S'?3:SUITS[ad.sk].el,kn=ad.sk==='S'?'쇠(칼)':FR[k];let rel;
 if(k===f)rel='나와 꼭 닮은 친구가 와서 힘을 두 배로 보태 주는';else if((k+1)%5===f)rel='내 기운을 살려 주는 든든한 도우미가 온';else if((f+1)%5===k)rel='내 기운을 나눠 주며 무언가를 키워 내는';else if((k+2)%5===f)rel='너무 달리지 않게 살짝 브레이크를 걸어 주는';else rel='내가 앞장서서 이끌어 가야 하는';
 return `🌳 사주에서 <b>${FR[f]} 친구</b>였던 ${who}에게 ${kn} 기운의 ‘${esc(ad.name)}’ 카드가 왔어요. ${rel} 날로 읽을 수 있어요. <small>(오행과 타로 무늬를 잇는 것은 이 앱이 재미로 만든 연결이에요.)</small>`}

/* 화면: 공통 */
function header(){const n=st.step>=4?4:st.step;$('#progress').innerHTML=[1,2,3,4].map(i=>`<i class="${i<=n?'on':''}"></i>`).join('');document.body.dataset.step=st.step;
 const T={1:['오늘은 어떤 카드가<br>나를 찾아올까?','궁금한 걸 쓰거나 말하고, 카드를 직접 골라 보세요.'],2:['카드 놓는 방법 고르기',''],3:['마음이 가는 카드를 골라요',''],4:['카드를 눌러 뒤집어요',''],5:['내 카드가 들려주는 이야기','']}[st.step];$('#coverTitle').innerHTML=T[0];$('#coverDesc').textContent=T[1]}
function actions(arr){$('#actionBar').innerHTML=`<div class="bar">${arr.map((x,i)=>`<button class="btn ${x.primary?'primary':'soft'}" data-action="${i}" ${x.disabled?'disabled':''}>${esc(x.label)}</button>`).join('')}</div>`;$$('[data-action]').forEach(b=>b.onclick=arr[+b.dataset.action].fn)}
function render(){header();({1:qStep,2:spreadStep,3:deckStep,4:revealStep,5:resultStep})[st.step]();if(st.step!==lastStep){window.scrollTo({top:0,behavior:'instant'});lastStep=st.step}}

/* 1단계: 질문 */
function promptCoach(q){if(/(죽고 싶|자살|자해|해치고 싶|사라지고 싶)/.test(q))return {hi:1,t:'많이 힘든 마음이 느껴져요. 카드보다 지금 바로 사람의 도움이 필요해요. 자살예방상담전화 109, 청소년상담 1388에 언제든 전화하거나 문자할 수 있어요.'};
 if(/(암|병원|진단|약을|임신|수술)/.test(q))return {t:'건강과 몸에 관한 일은 카드로 판단하지 말고 꼭 의사 선생님과 상의하세요. 타로는 마음을 정리하는 이야기로만 봐 주세요.'};
 if(/(그 사람|상대|걔|그 애|남편|아내).*(속마음|좋아하|생각해|사랑해)/.test(q))return {t:'다른 사람의 속마음은 카드로 확정할 수 없어요. “그 사람과 대화할 때 내가 살펴볼 점은?”처럼 바꿔 보면 더 도움이 돼요.'};
 if(/(합격할까|될까요|될까\?|성공할까|오를까|당첨|붙을까)/.test(q))return {t:'“될까?”보다 “잘되려면 내가 무엇을 준비할까?”로 바꿔 물으면 카드가 더 쓸모 있는 이야기를 들려줘요.'};return null}
function qStep(){const daily=load(KEYS.daily,null),dToday=daily&&daily.date===today();const draft=(()=>{try{return JSON.parse(sessionStorage.getItem(KEYS.draft)||'null')}catch(e){return null}})();
 $('#main').innerHTML=`${draft&&draft.picked&&draft.picked.length&&Date.now()-draft.created<3600000?`<section class="card note"><b>📌 아까 뽑은 카드 이야기가 있어요</b><button class="btn soft sm" id="reopen">다시 보기</button></section>`:''}
 ${st.source&&!st.source.fromRecord?`<section class="card note mint"><b>🌳 명리 나침반에서 왔어요</b><p>사주에서 쓰던 질문을 가져왔어요.${st.source.element!=null?` 사주 속 <b>${FR[st.source.element]} 친구</b>와 카드를 함께 읽어 드릴게요.`:''} 생년월일은 옮기지 않았어요.</p></section>`:''}
 <section class="card daily"><div class="dl"><span class="big">🌞</span><div><b>오늘의 카드 · ${new Date().getMonth()+1}월 ${new Date().getDate()}일</b><p>${dToday?'오늘 이미 뽑았어요. 다시 보기만 할 수 있어요.':'하루에 한 장! 질문 없이 바로 뽑아요.'}</p></div></div><button class="btn primary full" id="dailyBtn">${dToday?'오늘의 카드 다시 보기':'오늘의 카드 뽑기'}</button></section>
 <section class="card"><h2>💬 무엇이 궁금하세요?</h2><div class="qwrap"><textarea id="question" maxlength="400" placeholder="예: 친구랑 화해하려면 어떻게 할까?">${esc(st.question)}</textarea><button class="mic" id="voiceBtn" aria-label="말로 입력">🎤</button></div><p class="help">🎤를 누르고 말해도 돼요. 안 되면 휴대폰 키보드의 마이크를 쓰세요. (음성은 브라우저 회사 서버에서 글자로 바뀔 수 있어요)</p>
 <div class="chips">${[['💼 이직','이직을 하려면 무엇부터 준비할까요?'],['🧑‍🤝‍🧑 친구','친구와 다퉜는데 어떻게 화해할까요?'],['📚 시험','다음 시험을 잘 보려면 무엇을 바꿀까요?'],['💰 용돈','용돈을 아껴 쓰려면 어떻게 할까요?'],['💞 짝사랑','좋아하는 사람과 가까워지려면 어떻게 할까요?'],['🎤 발표','발표가 떨리는데 어떻게 준비할까요?']].map(x=>`<button class="chip" data-q="${esc(x[1])}">${x[0]}</button>`).join('')}</div>
 <label class="label" for="topic">고민 분야 <small class="muted">(질문을 보고 자동으로 골라요)</small></label><select id="topic">${TOPICS.map(([k,t])=>`<option value="${k}" ${k===st.topic?'selected':''}>${t}</option>`).join('')}</select><div id="coach"></div></section>
 <section class="card mini"><button class="link" id="sajuGoto">🌳 사주(명리 나침반)로 가기</button></section>`;
 $('#question').oninput=e=>{st.question=e.target.value;autoTopic();coach()};$('#topic').onchange=e=>st.topic=e.target.value;
 $$('[data-q]').forEach(b=>b.onclick=()=>{st.question=b.dataset.q;$('#question').value=st.question;autoTopic(true);coach()});
 $('#voiceBtn').onclick=voice;$('#dailyBtn').onclick=dailyStart;$('#sajuGoto').onclick=gotoSaju;if($('#reopen'))$('#reopen').onclick=()=>restore(draft);coach();
 actions([{label:'다음 · 카드 놓는 방법',primary:true,fn:()=>{st.question=$('#question').value.trim();st.topic=$('#topic').value;st.daily=false;st.spread=suggest(st.question);st.step=2;render()}}])}
function autoTopic(force){const g=guessTopic(st.question);if(g!=='general'||force){st.topic=g;$('#topic').value=g}}
function coach(){const m=promptCoach(st.question);$('#coach').innerHTML=m?`<p class="coach ${m.hi?'hi':''}">💡 ${esc(m.t)}</p>`:''}
function suggest(q){if(/(둘 중|할까 말까|어느 쪽|이직.*남|vs|아니면)/i.test(q))return 'two';if(/(과거|미래|앞으로|흐름|언제)/.test(q))return 'flow';if(/(오늘|하루)/.test(q))return 'one';return 'solve'}
function voice(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('이 브라우저는 음성 입력을 지원하지 않아요. 키보드의 🎤를 써 주세요.');return}if(speechOn){speech&&speech.stop();return}speech=new SR();speech.lang='ko-KR';speech.interimResults=false;speech.onresult=e=>{const t=e.results[0][0].transcript;st.question=($('#question').value+' '+t).trim().slice(0,400);$('#question').value=st.question;autoTopic();coach()};speech.onend=()=>{speechOn=false;$('#voiceBtn')&&$('#voiceBtn').classList.remove('on')};speech.onerror=()=>toast('음성 입력이 멈췄어요. 글로 써도 돼요.');try{speech.start();speechOn=true;$('#voiceBtn').classList.add('on');toast('말씀하세요… 🎙️')}catch(e){toast('마이크를 쓸 수 없어요.')}}

/* 2단계: 방법 */
function spreadStep(){const sug=suggest(st.question);const tile=x=>`<button class="choice ${x.id===st.spread?'on':''}" data-spread="${x.id}"><span class="ic">${x.icon}</span><b>${esc(x.title)}</b><small>${x.spots.length}장 · ${esc(x.sub)}</small>${x.id===sug?'<em>추천</em>':''}</button>`;
 const more=SPREADS.filter(x=>!x.main),open=more.some(x=>x.id===st.spread);
 $('#main').innerHTML=`<section class="card"><h2>🃏 어떤 방법으로 볼까요?</h2><div class="choices">${SPREADS.filter(x=>x.main).map(tile).join('')}</div><details class="more" ${open?'open':''}><summary>다른 방법 더 보기 (5장·7장·10장)</summary><div class="choices">${more.map(tile).join('')}</div></details>
 ${st.spread==='two'||st.spread==='choice5'?`<div class="ab"><label class="label" for="choiceA">🅰️ 선택 A</label><input type="text" id="choiceA" maxlength="40" value="${esc(st.a)}" placeholder="예: 지금 회사에 남기"><label class="label" for="choiceB">🅱️ 선택 B</label><input type="text" id="choiceB" maxlength="40" value="${esc(st.b)}" placeholder="예: 새 회사로 옮기기"></div>`:''}</section>
 <section class="card"><h3>↕️ 거꾸로 나온 카드도 볼까요?</h3><div class="seg" id="revSeg"><button class="${!st.reversed?'on':''}" data-v="0">😊 바로 선 카드만<small>처음이라면 추천</small></button><button class="${st.reversed?'on':''}" data-v="1">🔄 거꾸로도 보기<small>더 다양한 해석</small></button></div><p class="help">거꾸로 나온 카드(역방향)는 나쁜 뜻이 아니라 “속도를 늦추거나 안쪽을 살펴보라”는 뜻이에요.</p></section>`;
 const keepAB=()=>{if($('#choiceA')){st.a=$('#choiceA').value;st.b=$('#choiceB').value}};
 $$('[data-spread]').forEach(b=>b.onclick=()=>{keepAB();st.spread=b.dataset.spread;render()});$$('#revSeg button').forEach(b=>b.onclick=()=>{keepAB();st.reversed=b.dataset.v==='1';render()});
 if($('#choiceA')){$('#choiceA').oninput=e=>st.a=e.target.value;$('#choiceB').oninput=e=>st.b=e.target.value}
 actions([{label:'← 질문',fn:()=>{st.step=1;render()}},{label:'✨ 카드 섞기',primary:true,fn:()=>{keepAB();beforeShuffle()}}])}
function beforeShuffle(){const lq=load(KEYS.lastq,null);if(st.question&&lq&&lq.date===today()&&lq.q===st.question&&lq.rec){ask('🤔 오늘 이미 물어본 질문이에요','같은 질문을 여러 번 뽑으면 마음에 드는 답만 고르게 되기 쉬워요. 아까의 카드를 다시 볼까요?',[{label:'아까 결과 다시 보기',primary:true,fn:()=>restore(lq.rec)},{label:'그래도 새로 뽑기',fn:shuffle}]);return}shuffle()}
function shuffle(){st.deck=CARDS.map(c=>({id:c.id,rev:st.reversed?!!rnd(2):false}));for(let i=st.deck.length-1;i>0;i--){const j=rnd(i+1);[st.deck[i],st.deck[j]]=[st.deck[j],st.deck[i]]}st.picked=[];st.flipped=[];st.readId='';st.shuffling=true;st.step=3;render()}

/* 3단계: 카드 고르기 (부채꼴 가로 스크롤) */
function deckStep(){const sp=SP(st.spread),need=sp.spots.length;
 $('#main').innerHTML=`<section class="card slots"><div class="slotrow">${sp.spots.map((s,i)=>`<div class="slot ${i<st.picked.length?'done':''}" id="slot${i}"><span>${i<st.picked.length?'✓':i+1}</span>${esc(s[0])}</div>`).join('')}</div></section>
 <section class="card deckcard"><div id="shuffleShow" class="shuffle ${st.shuffling?'':'gone'}"><div class="riffle">${'<div class="rb"></div>'.repeat(6)}</div><p>카드를 섞고 있어요…<br><b>마음속으로 질문을 떠올려 보세요</b></p></div>
 <p class="pickhint" id="pickHint">${st.picked.length<need?`<b>${st.picked.length+1}번째 카드</b> · ${esc(sp.spots[st.picked.length][0])} 자리 — 👈 옆으로 밀며 골라요 👉`:'🎉 다 골랐어요!'}</p>
 <div class="fan" id="fan">${st.deck.map((d,i)=>`<button class="fc ${st.picked.some(p=>p.pos===i)?'taken':''}" data-pos="${i}" aria-label="${i+1}번째 카드 뒷면"><div class="tback"><span>✦</span></div></button>`).join('')}</div>
 <div class="tools"><button class="btn soft sm" id="reshuffle" ${st.picked.length?'disabled':''}>🔀 다시 섞기</button><button class="btn soft sm" id="autoPick">🎲 대신 골라 줘</button><button class="btn soft sm" id="sound">${st.sound?'🔊':'🔇'} 소리</button></div></section>`;
 if(st.shuffling){beep(420);setTimeout(()=>{st.shuffling=false;const s=$('#shuffleShow');s&&s.classList.add('gone')},matchMedia('(prefers-reduced-motion: reduce)').matches?50:1300)}
 $$('#fan .fc').forEach(b=>b.onclick=()=>pick(+b.dataset.pos));$('#reshuffle').onclick=()=>{if(!st.picked.length)shuffle()};$('#autoPick').onclick=()=>{const free=st.deck.map((d,i)=>i).filter(i=>!st.picked.some(p=>p.pos===i));pick(free[rnd(free.length)],true)};$('#sound').onclick=()=>{st.sound=!st.sound;$('#sound').textContent=(st.sound?'🔊':'🔇')+' 소리'};
 deckActions()}
function deckActions(){const need=SP(st.spread).spots.length,remain=need-st.picked.length;actions([{label:'← 방법',fn:()=>{if(!st.picked.length){st.step=2;render();return}ask('고른 카드를 버릴까요?','방법을 바꾸면 지금 고른 카드는 사라져요.',[{label:'네, 다시 고를래요',primary:true,fn:()=>{st.picked=[];st.step=2;render()}},{label:'아니요, 계속 고를래요'}])}},{label:remain?`${remain}장 더 골라요`:'🃏 카드 뒤집으러 가기',primary:!remain,disabled:!!remain,fn:()=>{st.step=4;persistDraft();render()}}])}
function pick(pos,auto){const sp=SP(st.spread),need=sp.spots.length;if(st.picked.length>=need||st.picked.some(p=>p.pos===pos))return;const d=st.deck[pos];st.picked.push({pos,id:d.id,rev:d.rev});beep(680);buzz();
 const el=$(`#fan .fc[data-pos="${pos}"]`);if(el){el.classList.add('taken');if(auto)el.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'})}
 const i=st.picked.length-1,sl=$('#slot'+i);if(sl){sl.classList.add('done','pop');sl.querySelector('span').textContent='✓'}
 $('#pickHint').innerHTML=st.picked.length<need?`<b>${st.picked.length+1}번째 카드</b> · ${esc(sp.spots[st.picked.length][0])} 자리`:'🎉 다 골랐어요! 아래 버튼을 눌러 뒤집으러 가요.';$('#reshuffle').disabled=true;deckActions()}

/* 4단계: 뒤집기 */
function revealStep(){const sp=SP(st.spread);
 $('#main').innerHTML=`<section class="card"><p class="center help">카드를 하나씩 눌러 뒤집어 보세요 ✨</p><div class="spread s${sp.spots.length}">${st.picked.map((p,i)=>{const c=CARD(p.id),f=st.flipped[i];return `<button class="flip ${f?'is':''}" data-i="${i}" aria-label="${esc(sp.spots[i][0])} 카드 뒤집기"><div class="inner"><div class="face back">${BACK}</div><div class="face front">${cardFace(c,p.rev)}</div></div><small>${i+1}. ${esc(sp.spots[i][0])}</small></button>`}).join('')}</div><div class="center"><button class="btn soft sm" id="flipAll">한 번에 모두 뒤집기</button></div></section><div id="peek"></div>`;
 $$('.flip').forEach(b=>b.onclick=()=>flip(+b.dataset.i));$('#flipAll').onclick=()=>st.picked.forEach((p,i)=>flip(i,true));peek();revealActions()}
function flip(i,silent){if(st.flipped[i])return;st.flipped[i]=true;const b=$(`.flip[data-i="${i}"]`);b&&b.classList.add('is');if(!silent){beep(880);buzz()}addSeen([st.picked[i].id]);peek(i);revealActions()}
function peek(i){const el=$('#peek');if(!el)return;if(i==null){el.innerHTML='';return}const p=st.picked[i],c=CARD(p.id);el.innerHTML=`<section class="card peek"><b>${esc(c.name)}</b> · ${esc(c.nick)}${p.rev?' <span class="tag">거꾸로</span>':''}<p>${esc(core(c,p.rev))}</p></section>`}
function revealActions(){const all=st.flipped.filter(Boolean).length===st.picked.length;actions([{label:all?'✨ 이야기 읽기':`${st.picked.length-st.flipped.filter(Boolean).length}장 남았어요`,primary:all,disabled:!all,fn:()=>{st.step=5;st.resultTab='easy';finishReading();render()}}])}
function finishReading(){if(!st.readId)st.readId=Date.now()+'-'+rnd(99999);const rec=recordObj();if(st.daily){save(KEYS.daily,{date:today(),rec})}else if(st.question){save(KEYS.lastq,{date:today(),q:st.question,rec})}persistDraft()}
function addSeen(ids){const s=new Set(load(KEYS.seen,[]));ids.forEach(x=>s.add(x));save(KEYS.seen,[...s])}

/* 오늘의 카드 */
function dailyStart(){const d=load(KEYS.daily,null);if(d&&d.date===today()&&d.rec){restore(d.rec);return}st.question='';st.topic='general';st.spread='one';st.reversed=false;st.daily=true;shuffle()}

/* 5단계: 결과 */
function cardBlock(p,i){const sp=SP(st.spread),c=CARD(p.id),[lab,role]=sp.spots[i],sit=sitOf(st.question,st.topic);

function shareCanvas(){const ps=st.picked,n=ps.length,per=n<=5?n:Math.ceil(n/2),rows=Math.ceil(n/per),W=900,cw=Math.min(150,Math.floor((W-120-(per-1)*14)/per)),ch=Math.round(cw*1.55),top=200,H=top+rows*(ch+56)+430;const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#FFF1E0');g.addColorStop(1,'#EEE8FF');x.fillStyle=g;x.fillRect(0,0,W,H);x.textAlign='center';x.fillStyle='#5B3FD6';x.font='bold 54px sans-serif';x.fillText('✦ 타로 나침반 ✦',W/2,100);x.fillStyle='#6E6A8F';x.font='28px sans-serif';x.fillText(SP(st.spread).title,W/2,150);

function roundRect(x,l,t,w,h,r){x.beginPath();x.moveTo(l+r,t);x.arcTo(l+w,t,l+w,t+h,r);x.arcTo(l+w,t+h,l,t+h,r);x.arcTo(l,t+h,l,t,r);x.arcTo(l,t,l+w,t,r);x.closePath()}

window.__tarotGotoSaju=()=>gotoSaju();window.__tarotSajuUrl=()=>sajuUrl();

init();

<script id="compass-cross-nav-init">
(function(){
 'use strict';var SAJU='https://mathlhk15-glitch.github.io/myeongri-compass/';
 function init(){if(document.getElementById('tarotTopSajuLink'))return;
   var cover=document.querySelector('.cover');if(!cover)return;
   var nav=document.createElement('nav');nav.id='tarotTopSajuLink';nav.className='tarot-cross-nav';nav.setAttribute('aria-label','명리 나침반 바로가기');
   var url=SAJU;try{url=(window.__tarotSajuUrl&&window.__tarotSajuUrl())||SAJU}catch(e){}

   cover.insertAdjacentElement('afterend',nav);
   nav.querySelector('a').addEventListener('click',function(e){if(typeof window.__tarotGotoSaju==='function'){e.preventDefault();var q=document.getElementById('question');if(q&&q.value.trim()){q.dispatchEvent(new Event('input'))}window.__tarotGotoSaju();}});
 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
