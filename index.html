cene":"두 마리 말이 끄는 수레를 이끄는 사람","keyword":"방향을 정하다","u":"가고 싶은 방향을 정하면 힘이 모여요. 할 일을 작게 나누어 꾸준히 움직여 봐요.","r":"속도를 높이느라 중요한 신호를 놓칠 수 있어요. 잠깐 멈춰 길을 다시 확인해요.","trad":"전차","element":"상징적 큰 주제"},{"id":"M8","name":"힘","arc":"major","number":8,"suit":"","emoji":"🦁","scene":"사자 곁에서 침착하게 손을 내미는 사람","keyword":"다정한 용기","u":"억지로 누르기보다 부드럽게 다가가는 힘을 떠올려요. 차분함도 큰 용기예요.","r":"마음을 꾹 눌러 참거나 자신을 너무 몰아붙일 수 있어요. 쉬어갈 용기를 내봐요.","trad":"힘","element":"상징적 큰 주제"},{"id":"M9","name":"은둔자","arc":"major","number":9,"suit":"","emoji":"🏮","scene":"작은 등불을 들고 산길을 걷는 여행자","keyword":"혼자 생각하기","u":"조용한 시간을 갖고 정말 원하는 것을 찾아봐요. 남의 목소리보다 내 생각이 들릴 수 있어요.","r":"혼자만 고민하면 길이 더 어두워질 수 있어요. 믿을 만한 사람에게 고민을 나눠 봐요.","trad":"은둔자","element":"상징적 큰 주제"},{"id":"M10","name":"운명의 수레바퀴","arc":"major","number":10,"suit":"","emoji":"🎡","scene":"돌아가는 커다란 바퀴","keyword":"바뀌는 계절","u":"상황은 늘 그대로 있지 않아요. 달라지는 조건을 살피고 새로운 기회를 준비해요.","r":"운이 대신 해결해 주리라 기다리지 말아요. 내가 할 수 있는 작은 일부터 시작해요.","trad":"운명의 수레바퀴","element":"상징적 큰 주제"},{"id":"M11","name":"정의","arc":"major","number":11,"suit":"","emoji":"⚖️","scene":"저울을 들고 판단을 준비하는 사람","keyword":"공평하게 보기","u":"느낌뿐 아니라 사실과 약속을 살펴보세요. 양쪽 이야기를 듣는 것이 도움이 돼요.","r":"잘잘못만 따지다가 마음을 놓칠 수 있어요. 공정함과 배려를 함께 챙겨요.","trad":"정의","element":"상징적 큰 주제"},{"id":"M12","name":"매달린 사람","arc":"major","number":12,"suit":"","emoji":"🙃","scene":"나무에서 거꾸로 세상을 바라보는 사람","keyword":"거꾸로 바라보기","u":"잠깐 멈추면 전에는 안 보이던 길이 보여요. 다르게 생각해 볼 시간을 가져요.","r":"기다림이 너무 길어졌을 수 있어요. 생각을 바꾼 뒤에는 작은 행동을 정해요.","trad":"매달린 사람","element":"상징적 큰 주제"},{"id":"M13","name":"죽음","arc":"major","number":13,"suit":"","emoji":"🚪","scene":"낡은 문이 닫히고 새 길이 열리는 풍경","keyword":"끝과 새 시작","u":"무언가의 끝은 다른 시작을 준비하는 시간이기도 해요. 놓아줄 것을 찾아봐요.","r":"변화를 무서워해 오래된 방식을 붙들 수 있어요. 아주 작은 것부터 바꿔 봐요.","trad":"죽음","element":"상징적 큰 주제"},{"id":"M14","name":"절제","arc":"major","number":14,"suit":"","emoji":"🥛","scene":"두 그릇의 물을 천천히 옮기는 사람","keyword":"알맞게 섞기","u":"서로 다른 마음과 일을 알맞게 섞는 연습이에요. 너무 빠르지도 느리지도 않게 가 봐요.","r":"한쪽에 지나치게 쏠릴 수 있어요. 쉬는 시간과 움직이는 시간의 균형을 찾아요.","trad":"절제","element":"상징적 const cryptoInt=max=>{if(!globalThis.crypto?.getRandomValues)throw Error('안전한 카드 섞기 기능을 사용할 수 없는 환경이에요. HTTPS에서 열어 주세요.');const limit=0x100000000-(0x100000000%max);let v;do{const a=new Uint32Array(1);crypto.getRandomValues(a);v=a[0]}while(v>=limit);return v%max};
function playSound(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const ctx=new AC(),osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='sine';osc.frequency.setValueAtTime(620,ctx.currentTime);osc.frequency.exponentialRampToValueAtTime(340,ctx.currentTime+.09);gain.gain.setValueAtTime(.035,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.1);osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.1);osc.onended=()=>ctx.close()}catch(e){}}

function suggest(q){if(/(둘 중|A와 B|할까 말까|남을까|이직.*잔류|어느 쪽|비교|선택지)/i.test(q))return 'two';if(/(과거|현재|미래|언제|흐름|앞으로)/.test(q))return 'flow';if(/오늘|하루/.test(q))return 'one';if(/깊이|자세히|오래|여러/.test(q))return 'five';return 'solve'}

function sajuCompare(){const sum=load('saju_compass_shared_summary_v1',null),person=st.person?`사주에서 함께 읽던 이름: ${escape(st.person)}<br>`:'';return `<p style="font-size:14px">${person}사주는 태어난 정보를 바탕으로 큰 흐름을 보는 전통 이야기이고, 타로는 지금 뽑은 카드로 현재 고민을 살펴보는 이야기예요.</p>${sum&&sum.theme?`<div class="hintbox"><b>사주에서 참고한 주제:</b> ${escape(String(sum.theme).slice(0,120))}<br><b>타로에서 나온 주제:</b> ${escape(synthesis().lead)}<br>두 이야기가 서로 달라도 억지로 맞추지 않아요.</div>`:'<p class="help">사주 사이트에서 별도의 요약 정보를 전송하지 않았다면, 지금은 두 프로그램을 오가며 각각의 결과를 볼 수 있어요. 사주 결과를 자동으로 가져온 척하지는 않습니다.</p>'}`}
function actions(arr){$('#actionBar').innerHTML=`<div class="button-row" style="max-width:580px;margin:auto">${arr.map((x,i)=>`<button class="btn ${x.primary?'primary':'secondary'}" data-action="${i}" ${x.disabled?'disabled':''}>${escape(x.label)}</button>`).join('')}</div>`;$$('[data-action]').forEach(b=>b.onclick=arr[+b.dataset.action].fn)}
function render(){badge();if(st.step===1)setupStep();else if(st.step===2)spreadStep();else if(st.step===3)deckStep();else resultStep();window.scrollTo({top:0,behavior:'instant'})}
function resultText(includeQuestion=false){if(!st.picked.length)return '';const s=synthesis(),sp=SPREADS.find(x=>x.id===st.spread);return `🔮 타로 나침반 · ${sp.title}\n${includeQuestion&&st.question?'💬 질문: '+st.question+'\n':''}\n✨ ${s.lead}\n\n${s.paragraphs.slice(0,3).join('\n\n')}\n\n🃏 나의 카드\n${st.picked.map((p,i)=>`${i+1}. ${sp.spots[i]}: ${cardObj(p).name} (${p.rev?'역방향':'정방향'})`).join('\n')}\n\n🎯 작은 실천: ${s.mission}\n\n*타로 상징을 바탕으로 한 재미있는 이야기이며, 미래를 확정하지 않습니다.*`}
async function copy(t){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(t);toast('복사했어요!');return true}}catch(e){}const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();const success=document.execCommand('copy');a.remove();toast(success?'복사했어요!':'이 브라우저에서 복사하지 못했어요.');return success}
const copyResult=()=>copy(resultText());
function modal(html){$('#modalContent').innerHTML=html;$('#modal').hidden=false;$('#modal').onclick=e=>{if(e.target===$('#modal'))closeModal()};$('#modalContent').querySelectorAll('[data-close]').forEach(x=>x.onclick=closeModal)}function closeModal(){$('#modal').hidden=true}
function shareDialog(){modal(`<h2>📮 운세 이야기 보내기</h2><p class="help">카카오톡·문자로 보내기 전에 내용을 확인해 주세요. 개인적인 질문은 기본으로 제외합니다.</p><label class="row"><input type="checkbox" id="shareQuestion" style="width:22px;height:22px"/> <span>내가 쓴 질문도 함께 보내기</span></label><textarea id="sharePreview" style="min-height:260px">${escape(resultText())}</textarea><div class="button-row"><button class="btn primary sm" id="doShare">📤 공유 메뉴</button><button class="btn secondary sm" id="doSMS">✉️ 문자 앱</button><button class="btn secondary sm" id="doCopy">📋 복사</button></div><button class="btn outline full sm" data-close style="margin-top:9px">닫기</button>`);$('#shareQuestion').onchange=e=>$('#sharePreview').value=resultText(e.target.checked);$('#doCopy').onclick=()=>copy($('#sharePreview').value);$('#doShare').onclick=async()=>{const t=$('#sharePreview').value;try{if(navigator.share){await navigator.share({title:'타로 나침반',text:t});return}}catch(e){if(e.name==='AbortError')return}await copy(t);toast('공유 메뉴를 사용할 수 없어 글을 복사했어요.')};$('#doSMS').onclick=()=>{const t=$('#sharePreview').value;if(t.length>750){toast('내용이 길어 복사합니다. 문자 앱에 붙여 넣어 주세요.');copy(t);return}location.href='sms:?&body='+encodeURIComponent(t)}}
function drawShareCanvas(){const c=document.createElement('canvas');c.width=900;c.height=1250;const x=c.getContext('2d');x.fillStyle='#19224b';x.fillRect(0,0,900,1250);x.strokeStyle='#d8b571';x.lineWidth=8;x.strokeRect(30,30,840,1190);x.fillStyle='#f5d488';x.font='bold 56px sans-serif';x.textAlign='center';x.fillText('✦ 타로 나침반 ✦',450,116);x.font='32px sans-serif';x.fillStyle='#e7edff';x.fillText('내가 직접 뽑은 카드',450,178);const cs=st.picked.slice(0,5);const w=cs.length>=4?148:220,space=12,total=cs.length*w+(cs.length-1)*space;let start=(900-total)/2;const emojis=cs.map(p=>cardObj(p).emoji);cs.forEach((p,i)=>{const card=cardObj(p);const left=start+i*(w+space);x.fillStyle='#344478';x.fillRect(left,255,w,315);x.strokeStyle='#cfad67';x.lineWidth=5;x.strokeRect(left+4,259,w-8,307);x.font='56px sans-serif';x.fillStyle='white';x.fillText(card.emoji,left+w/2,390);x.font='bold 17px sans-serif';x.fillStyle='#f5e6bd';x.fillText((card.name.length>8?card.name.slice(0,8):card.name),left+w/2,485);x.font='14px sans-serif';x.fillText(p.rev?'역방향':'정방향',left+w/2,522)});const s=synthesis();x.font='bold 33px sans-serif';x.fillStyle='#f5d488';x.fillText('오늘의 카드 이야기',450,662);wrapCanvas(x,s.lead,450,720,770,42,31);x.fillStyle='#f1f5ff';x.font='27px sans-serif';wrapCanvas(x,s.paragraphs[2],450,850,760,42,26);x.fillStyle='#f5d488';x.font='24px sans-serif';wrapCanvas(x,'🎯 '+s.mission,450,1060,760,37,23);x.font='19px sans-serif';x.fillStyle='#bfc9e7';x.fillText('질문과 생년월일을 제외한 공유 카드 · 재미로 보는 상징 해석',450,1195);return c}
function wrapCanvas(ctx,t,x,y,maxWidth,lineHeight,font){ctx.font=`${font}px sans-serif`;const chars=Array.from(t),lines=[''];for(const ch of chars){let s=lines[lines.length-1]+ch;if(ctx.measureText(s).width>maxWidth){lines.push(ch)}else lines[lines.length-1]=s}lines.slice(0,6).forEach((line,i)=>ctx.fillText(line,x,y+i*lineHeight))}
async function shareImage(){const canvas=drawShareCanvas();canvas.toBlob(async blob=>{if(!blob){toast('이미지를 만들 수 없어요.');return}const file=new File([blob],'tarot_story.png',{type:'image/png'});try{if(navigator.canShare&&navigator.canShare({files:[file]})&&navigator.share){await navigator.share({files:[file],title:'타로 나침반'});return}}catch(e){if(e.name==='AbortError')return}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='tarot_story.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('이미지로 저장했어요. 카톡에서 사진으로 공유해 주세요.')},'image/png')}
function saveReading(){if(!st.picked.length)return;const items=load(HISTORY_KEY,[]);if(!Array.isArray(items)){toast('저장 자료 형태가 달라서 덮어쓰지 않았어요.');return}const rec={id:Date.now()+'-'+cryptoInt(100000),created:Date.now(),question:st.question,topic:st.topic,spread:st.spread,reversed:st.reversed,picked:st.picked.map(p=>({id:p.id,rev:p.rev,pos:p.pos})),a:st.a,b:st.b};items.unshift(rec);if(items.length>150)items.length=150;if(save(HISTORY_KEY,items))toast('이 기기의 타로 일기에 저장했어요!');}
function persistDraft(){try{sessionStorage.setItem('tarot_compass_draft_v1',JSON.stringify({question:st.question,topic:st.topic,spread:st.spread,picked:st.picked,reversed:st.reversed,a:st.a,b:st.b,created:Date.now()}))}catch(e){}}
function restoreRecord(rec){if(!rec||!Array.isArray(rec.picked)||!SPREADS.some(s=>s.id===rec.spread))return;st.question=rec.question||'';st.topic=TOPICTEXT[rec.topic]?rec.topic:'general';st.spread=rec.spread;st.reversed=!!rec.reversed;st.picked=rec.picked.filter(p=>CARDS.some(c=>c.id===p.id));if(st.picked.length!==SPREADS.find(s=>s.id===st.spread).n){toast('이 기록의 카드 수가 맞지 않아요.');return}st.a=rec.a||'';st.b=rec.b||'';st.reveal=st.picked.length;st.step=4;st.resultTab='easy';closeModal();render()}
function openHistory(){const items=load(HISTORY_KEY,[]),list=Array.isArray(items)?items:[];const viewed=new Set(list.flatMap(x=>Array.isArray(x.picked)?x.picked.map(p=>p.id):[]));modal(`<h2>📖 내 타로 일기</h2><p class="help">저장한 리딩 ${list.length}개 · 만난 카드 ${viewed.size}/78장</p><div class="button-row"><button class="btn secondary sm" id="seeCollection">78장 도감 보기</button><button class="btn secondary sm" id="wipeHistory">전체 기록 지우기</button></div><div class="save-list" style="margin-top:13px">${list.length?list.slice(0,100).map(x=>`<div class="save-item"><div class="title">${escape(x.question||'오늘의 카드')}</div><small>${new Date(x.created).toLocaleString('ko-KR')} · ${escape(SPREADS.find(s=>s.id===x.spread)?.title||'타로')}</small><div class="button-row"><button class="btn secondary sm" data-load="${escape(x.id)}">다시 읽기</button><button class="btn outline sm" data-delete="${escape(x.id)}">삭제</button></div></div>`).join(''):'<p class="help">아직 기록이 없어요. 카드를 뽑고 결과를 저장하면 여기에 쌓입니다.</p>'}</div><button class="btn outline full sm" data-close style="margin-top:13px">닫기</button>`);$('#seeCollection').onclick=()=>openCollection(viewed);$('#wipeHistory').onclick=()=>{if(confirm('모든 타로 일기를 지울까요?')){save(HISTORY_KEY,[]);openHistory()}};$$('[data-load]').forEach(b=>b.onclick=()=>restoreRecord(list.find(x=>x.id===b.dataset.load)));$$('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('이 기록을 지울까요?')){save(HISTORY_KEY,list.filter(x=>x.id!==b.dataset.delete));openHistory()}})}
function openCollection(seen){modal(`<h2>✨ 내가 만난 타로 카드</h2><p class="help">지금까지 만난 카드 ${seen.size} / 78장. 아직 못 만난 카드도 이름과 그림 상징을 미리 볼 수 있어요.</p><div class="collection">${CARDS.map(c=>`<div class="tile ${seen.has(c.id)?'seen':''}"><span>${c.emoji}</span>${escape(c.name)}<br><small>${seen.has(c.id)?'✓ 만났어요':'아직 만난 적 없어요'}</small></div>`).join('')}</div><button class="btn full secondary sm" id="backHist" style="margin-top:12px">← 내 기록</button>`);$('#backHist').onclick=openHistory}
function listen(){if(!('speechSynthesis'in window)){toast('음성 읽어주기를 지원하지 않아요.');return}if(speechSynthesis.speaking){speechSynthesis.cancel();toast('읽어주기를 멈췄어요.');return}const u=new SpeechSynthesisUtterance(resultText(false).slice(0,1600));u.lang='ko-KR';u.rate=.9;speechSynthesis.speak(u);toast('해설을 읽어 드릴게요. 다시 누르면 멈춥니다.')}
function gotoSaju(){const url=st.prefs.sajuUrl||DEFAULT_SAJU;if(st.question){save(BRIDGE_KEY,{question:st.question,topic:st.topic,createdAt:Date.now(),source:'tarot'})}window.location.href=url}
function openSettings(){const profiles=load('saju_people',[]),names=Array.isArray(profiles)?profiles.slice(0,30).map((p,i)=>`<option value="${i}">${escape(p?.name||p?.inp?.name||`저장 인물 ${i+1}`)}</option>`).join(''):'';modal(`<h2>⚙️ 사주와 이어 보기</h2><p class="help">사주와 타로는 서로 다른 해석 방법이에요. 타로의 카드 순서는 사주 내용과 관계없이 무작위로 정합니다.</p><label class="label" for="sajuUrl">명리 나침반 사이트 주소 또는 파일명</label><input type="text" id="sajuUrl" value="${escape(st.prefs.sajuUrl||DEFAULT_SAJU)}" placeholder="예: ../saju/index.html"><button class="btn secondary sm" id="saveSajuUrl" style="margin-top:7px">주소 저장</button>${names?`<label class="label" for="sajuPerson">같은 도메인에 저장된 인물 (선택)</label><select id="sajuPerson"><option value="">선택하지 않음</option>${names}</select><p class="help">기기에 저장된 이름만 선택합니다. <b>출생정보로 타로 카드를 바꾸지 않습니다.</b></p>`:`<p class="hintbox">같은 웹사이트 주소에서 저장된 사주 인물을 찾지 못했어요. 별도 주소에 있다면 자동 공유되지 않을 수 있어요.</p>`}<h3 style="margin-top:22px">🔗 연결 방법</h3><p class="help">같은 GitHub Pages 도메인 안에 타로·사주를 두면 일부 저장공간을 함께 쓸 수 있어요. 사주 사이트에는 별도의 '타로로 이어 보기' 버튼을 추가한 연동판을 사용하세요. 질문은 30분 동안만 이어받고, 생년월일이나 출생시각은 주소에 넣지 않습니다.</p><button class="btn outline full sm" data-close>닫기</button>`);$('#saveSajuUrl').onclick=()=>{st.prefs.sajuUrl=$('#sajuUrl').value.trim()||DEFAULT_SAJU;save(SETTINGS_KEY,st.prefs);toast('사주 사이트 주소를 저장했어요.')};$('#sajuPerson')?.addEventListener('change',e=>{st.person=e.target.value===''?'':String((profiles[+e.target.value]||{}).name||(profiles[+e.target.value]||{}).inp?.name||'').slice(0,24);toast(st.person?st.person+' 선택 · 카드는 무작위로 뽑아요.':'선택 해제')})}
function init(){st.prefs={sajuUrl:DEFAULT_SAJU,...load(SETTINGS_KEY,{})};startFromBridge();const draft=(()=>{try{return JSON.parse(sessionStorage.getItem('tarot_compass_draft_v1')||'null')}catch(e){return null}})();if(draft&&draft.picked?.length&&Date.now()-draft.created<3600000&&confirm('아까 뽑은 카드를 다시 읽어 볼까요?'))restoreRecord(draft);else render();$('#openHistory').onclick=openHistory;$('#openSettings').onclick=openSettings;window.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});}
init();
})();
</script></body></html>
